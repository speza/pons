name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Format, test, and vet
        run: make fmt-check test vet

      - name: Race tests
        run: make test-race

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.0
          args: --timeout=5m
