<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pons-system-diagram-design-title pons-system-diagram-design-desc">
      <title id="pons-system-diagram-design-title">pons execution architecture</title>
      <desc id="pons-system-diagram-design-desc">A client submits messages to the pons server. The runtime starts Core, which exchanges plans with brain plugins and executes tools through a pons-hands tool host that always runs in a Seatbelt or E2B sandbox; the agent's memory directory is its only grant beyond the workspace. Runtime state is stored in SQLite on host disk.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');

          .node-name { fill: #2d3142; font: 600 12px 'Geist', Arial, sans-serif; }
          .node-detail { fill: #4f5d75; font: 9px 'Geist Mono', monospace; }
          .tag { font: 500 8px 'Geist Mono', monospace; letter-spacing: .08em; }
          .zone-label { fill: #7a8399; font: 500 8px 'Geist Mono', monospace; letter-spacing: .14em; }
          .edge-label { fill: #4f5d75; font: 8px 'Geist Mono', monospace; letter-spacing: .06em; }
          .footer-note { fill: #4f5d75; font: 9px 'Geist Mono', monospace; }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="1280" height="720" fill="#f5f5f5"/>

      <!-- Physical execution zones. SQLite is deliberately outside the server-process frame. -->
      <rect x="248" y="104" width="680" height="448" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="260" y="108" width="156" height="16" rx="2" fill="#f5f5f5"/>
      <text x="268" y="120" class="zone-label">PONS SERVER PROCESS</text>

      <rect x="972" y="288" width="260" height="264" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="984" y="292" width="208" height="16" rx="2" fill="#f5f5f5"/>
      <text x="992" y="304" class="zone-label">SANDBOXED TOOL HOST</text>

      <!-- Connections are behind the nodes; all off-axis routes use rounded elbows. -->
      <line x1="192" y1="332" x2="280" y2="332" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
      <line x1="440" y1="332" x2="504" y2="332" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <line x1="360" y1="372" x2="360" y2="584" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 664,312 H 684 Q 692,312 692,304 V 232 Q 692,224 700,224 H 720" fill="none" stroke="#4f5d75" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <path d="M 664,332 H 948 Q 956,332 956,340 V 424 Q 956,432 964,432 H 1000" fill="none" stroke="#eb6c36" stroke-width="1.5" marker-start="url(#arrow-accent)" marker-end="url(#arrow-accent)"/>

      <!-- Connector labels, each set back from its stroke. -->
      <rect x="205" y="312" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="237" y="321" class="edge-label" text-anchor="middle">HTTP/SSE</text>
      <rect x="450" y="312" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="472" y="321" class="edge-label" text-anchor="middle">RUN</text>
      <rect x="370" y="464" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="396" y="473" class="edge-label" text-anchor="middle">STATE</text>
      <rect x="642" y="260" width="42" height="12" rx="2" fill="#f5f5f5"/>
      <text x="663" y="269" class="edge-label" text-anchor="middle">PLAN</text>
      <rect x="790" y="312" width="108" height="12" rx="2" fill="#f5f5f5"/>
      <text x="844" y="321" class="edge-label" text-anchor="middle">TOOLS · SANDBOXED</text>

      <!-- Client -->
      <rect x="48" y="292" width="144" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="48" y="292" width="144" height="80" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="60" y="302" width="44" height="14" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.40" stroke-width=".8"/>
      <text x="82" y="312" class="tag" fill="#7a8399" text-anchor="middle">CLIENT</text>
      <text x="120" y="340" class="node-name" text-anchor="middle">CLI / HTTP client</text>
      <text x="120" y="356" class="node-detail" text-anchor="middle">messages · events</text>

      <!-- Runtime -->
      <rect x="280" y="292" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="292" width="160" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
      <rect x="292" y="302" width="52" height="14" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width=".8"/>
      <text x="318" y="312" class="tag" fill="#2d3142" text-anchor="middle">RUNTIME</text>
      <text x="360" y="340" class="node-name" text-anchor="middle">Runtime manager</text>
      <text x="360" y="356" class="node-detail" text-anchor="middle">queue · SSE</text>

      <!-- Core -->
      <rect x="504" y="292" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="504" y="292" width="160" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
      <rect x="516" y="302" width="44" height="14" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width=".8"/>
      <text x="538" y="312" class="tag" fill="#2d3142" text-anchor="middle">KERNEL</text>
      <text x="584" y="340" class="node-name" text-anchor="middle">Core.Run</text>
      <text x="584" y="356" class="node-detail" text-anchor="middle">turn loop · registry</text>

      <!-- Brain -->
      <rect x="720" y="184" width="168" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="720" y="184" width="168" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
      <rect x="732" y="194" width="44" height="14" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width=".8"/>
      <text x="754" y="204" class="tag" fill="#2d3142" text-anchor="middle">BRAIN</text>
      <text x="804" y="232" class="node-name" text-anchor="middle">Brain plugins</text>
      <text x="804" y="248" class="node-detail" text-anchor="middle">LLM · scripted</text>

      <!-- Host disk, outside the server-process boundary -->
      <rect x="280" y="584" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="584" width="160" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="292" y="592" width="44" height="14" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width=".8"/>
      <text x="314" y="602" class="tag" fill="#4f5d75" text-anchor="middle">STORE</text>
      <text x="360" y="621" class="node-name" text-anchor="middle">SQLite store</text>
      <text x="360" y="636" class="node-detail" text-anchor="middle">host disk</text>

      <!-- Sandboxed hands environment, used by every run -->
      <rect x="1000" y="376" width="204" height="112" rx="6" fill="#f5f5f5"/>
      <rect x="1000" y="376" width="204" height="112" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1.5"/>
      <rect x="1012" y="388" width="44" height="14" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width=".8"/>
      <text x="1034" y="398" class="tag" fill="#eb6c36" text-anchor="middle">HANDS</text>
      <text x="1102" y="427" class="node-name" text-anchor="middle">pons-hands</text>
      <text x="1102" y="446" class="node-detail" text-anchor="middle">fs/edit/bash · external manifests</text>
      <text x="1102" y="464" class="node-detail" text-anchor="middle">Seatbelt local · E2B remote</text>
      <text x="1102" y="480" class="node-detail" text-anchor="middle">workspace + agent memory</text>

      <!-- Editorial note / legend strip -->
      <line x1="48" y1="672" x2="1232" y2="672" stroke="#2d3142" stroke-opacity="0.12" stroke-width=".8"/>
      <text x="48" y="694" class="footer-note">HANDS ALWAYS RUN IN A SANDBOX</text>
      <text x="344" y="694" class="footer-note">protocol.Action / ToolResult OVER tool_provider/v1</text>
      <text x="804" y="694" class="footer-note">NO IN-PROCESS HANDS</text>
    </svg>
